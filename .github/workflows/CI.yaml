name: "CI"

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cs:
    name: "Code style"
    runs-on: ubuntu-latest
    steps:
      - name: "Git: checkout"
        uses: actions/checkout@v4

      - name: "PHP: setup 8.2"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: "Composer: validate"
        run: composer validate --strict

      - name: "Composer: install"
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: "Php-CS-Fixer: check"
        run: vendor/bin/php-cs-fixer fix --diff --dry-run

  sa:
    name: "Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: "Git: checkout"
        uses: actions/checkout@v4

      - name: "PHP: setup 8.4"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: "Composer: install"
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: "PHPStan: analyze"
        run: vendor/bin/phpstan

  unit-tests:
    name: "Unit Tests (PHP ${{ matrix.php-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
      fail-fast: false
    steps:
      - name: "Git: checkout"
        uses: actions/checkout@v4

      - name: "PHP: setup ${{ matrix.php-version }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.php-version == '8.5' && 'pcov' || 'none' }}

      - name: "Composer: install"
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --prefer-dist

      - name: "PHPUnit: tests"
        run: vendor/bin/phpunit --testsuite=unit ${{ matrix.php-version == '8.5' && '--coverage-clover=coverage-unit.xml' || '--no-coverage' }}

      - name: "Coverage: save unit report"
        if: matrix.php-version == '8.5'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage-unit.xml
          if-no-files-found: error

  integration-tests:
    name: "Integration Tests (PHP ${{ matrix.php-version }} ${{ matrix.dependencies }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php-version: '8.2'
            dependencies: 'low'
          - php-version: '8.5'
            dependencies: 'high'
      fail-fast: false
    steps:
      - name: "Git: checkout"
        uses: actions/checkout@v4

      - name: "PHP: setup ${{ matrix.php-version }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.php-version == '8.5' && 'pcov' || 'none' }}

      - name: "Node: setup"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Composer: install (${{ matrix.dependencies }})"
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies == 'low' && 'lowest' || 'highest' }}
          composer-options: --prefer-dist

      - name: "Playwright: cache browsers"
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('bin/package.json') }}
          restore-keys: ms-playwright-${{ runner.os }}-

      - name: "Playwright: install browsers"
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if timeout 300 php bin/playwright-install --with-deps; then
              exit 0
            fi
            echo "Attempt $attempt failed or timed out after 5 minutes, retrying."
          done
          exit 1

      - name: "PHPUnit: integration and functional tests"
        run: vendor/bin/phpunit --testsuite=integration,functional ${{ matrix.php-version == '8.5' && '--coverage-clover=coverage-browser.xml' || '--no-coverage' }}

      - name: "Coverage: save browser report"
        if: matrix.php-version == '8.5'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-browser
          path: coverage-browser.xml
          if-no-files-found: error

  coverage:
    name: "Coverage"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: "Git: checkout"
        uses: actions/checkout@v4

      - name: "Coverage: download reports"
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage

      - name: "Codecov: upload coverage"
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-unit.xml,./coverage/coverage-browser.xml
          disable_search: true
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
